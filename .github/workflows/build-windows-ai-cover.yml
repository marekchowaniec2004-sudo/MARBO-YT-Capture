name: Build MARBO AI Cover Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'windows-ai-cover/**'
      - '.github/workflows/build-windows-ai-cover.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "MARBO-AI-Cover" "windows-ai-cover/app.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MARBO-AI-Cover-Windows
          path: dist/MARBO-AI-Cover.exe
          if-no-files-found: error
